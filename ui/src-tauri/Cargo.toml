[package]
name = "wallbloom-ui"
version = "0.1.0"
edition = "2021"
default-run = "wallbloom-ui"

[features]
native-acceptance = []

[[bin]]
name = "wallbloom-native-acceptance"
path = "src/bin/native-acceptance.rs"
required-features = ["native-acceptance"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tauri = { version = "2" }
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
rustra = { version = "=0.11.0", features = ["tauri"] }
schemars = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
